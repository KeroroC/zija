# 知家 Web 入口：静态资源 + /api 反向代理。
#
# TLS 终止不在本容器内完成（见 docs/deploy/deploy.md §5）：生产部署须在
# 前端放置 Nginx / Caddy / Traefik 等 TLS 反代，并透传 X-Forwarded-Proto: https，
# 否则后端 Cookie 的 Secure 标志无法生效。HSTS 也应由该 TLS 反代下发。
#
# 上游已带 X-Forwarded-Proto（TLS 终止场景）时透传之；缺失时回退为本机 scheme，
# 保证直接 HTTP 暴露下请求不被错误标记为安全通道。
map $http_x_forwarded_proto $x_forwarded_proto {
    default $scheme;
    http    http;
    https   https;
}

server {
    listen 80;
    server_name _;

    # 与后端 multipart 上限（application.yml: spring.servlet.multipart.max-file-size=20MB）对齐
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    location /actuator/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
