name: zija

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${ZIJA_POSTGRES_DB:-zija}
      POSTGRES_USER: ${ZIJA_POSTGRES_USER:-zija}
      POSTGRES_PASSWORD: ${ZIJA_POSTGRES_PASSWORD:?set ZIJA_POSTGRES_PASSWORD}
    ports:
      - "${ZIJA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${ZIJA_POSTGRES_USER:-zija} -d ${ZIJA_POSTGRES_DB:-zija}
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: deploy/app/Dockerfile
    environment:
      ZIJA_DB_URL: jdbc:postgresql://postgres:5432/${ZIJA_POSTGRES_DB:-zija}
      ZIJA_DB_USERNAME: ${ZIJA_POSTGRES_USER:-zija}
      ZIJA_DB_PASSWORD: ${ZIJA_POSTGRES_PASSWORD:?set ZIJA_POSTGRES_PASSWORD}
      ZIJA_VERSION: ${ZIJA_VERSION:-dev}
      ZIJA_PROFILES_ACTIVE: ${ZIJA_PROFILES_ACTIVE:-}
      ZIJA_SETUP_TOKEN: ${ZIJA_SETUP_TOKEN:-}
      ZIJA_FILE_STORAGE_PATH: /var/lib/zija/files
      ZIJA_AI_OLLAMA_BASE_URL: ${ZIJA_AI_OLLAMA_BASE_URL:-http://localhost:11434}
      ZIJA_AI_CHAT_MODEL: ${ZIJA_AI_CHAT_MODEL:-qwen2.5:7b}
      ZIJA_AI_EMBEDDING_MODEL: ${ZIJA_AI_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      ZIJA_LOG_PATH: /var/lib/zija/logs
      # 不给值：仅当 .env 设置时才传入，未设置时级别跟随 profile（开发 DEBUG / prod INFO）
      ZIJA_LOG_LEVEL:
      ZIJA_LOG_SQL_LEVEL: ${ZIJA_LOG_SQL_LEVEL:-INFO}
      ZIJA_LOG_MAX_HISTORY: ${ZIJA_LOG_MAX_HISTORY:-14}
      ZIJA_LOG_TOTAL_SIZE_CAP: ${ZIJA_LOG_TOTAL_SIZE_CAP:-1GB}
      ZIJA_LOG_SLOW_REQUEST_MS: ${ZIJA_LOG_SLOW_REQUEST_MS:-1000}
    volumes:
      - zija-files:/var/lib/zija/files
      - zija-logs:/var/lib/zija/logs
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8080/actuator/health/readiness
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    ports:
      - "${ZIJA_HTTP_PORT:-8088}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://localhost/healthz | grep -q ok
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  zija-files:
  zija-logs:
