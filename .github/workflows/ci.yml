name: ci

# 开发在 dev 分支上进行，PR 合并到 main 后视为发布。
# 合并到 main 时跑完整 CI（含 deployment-smoke），dev 上只跑单元/构建测试。
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Build frontend
        run: npm --prefix frontend run build

  # 仅在 main 分支（push 或 PR target）上跑 smoke，避免 dev 上反复起容器浪费时间。
  deployment-smoke:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Chromium
        run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Run Compose smoke
        run: ./scripts/compose-smoke.sh
      - name: Run browser smoke
        run: ./scripts/e2e-smoke.sh
