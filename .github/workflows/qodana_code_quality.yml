name: Qodana
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main   # 仅目标为 main 的 PR（即 dev → main）才触发扫描
  push:
    branches:
      - main   # 发布基线：PR 合并后扫描，保证主干质量
      - dev    # 开发集成分支：新代码 push 后扫描，尽早暴露问题

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1374619546 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
