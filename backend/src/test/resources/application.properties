spring.profiles.active=test
# 关闭全部后台 @Scheduled 任务（"-" 即 ScheduledTaskRegistrar.CRON_DISABLED）。
# 集成测试共用同一个 Postgres 实例（SharedPostgres）且 Spring 上下文全程缓存，
# 后台任务写库会与各测试类的 TRUNCATE 形成锁顺序反转 → PostgreSQL deadlock、CI 随机失败。
# 各调度方法在测试中均以直接调用方式覆盖（scanAt / sendDailyDigests / retryOnceNow），
# 关闭不损失任何覆盖。详见 NoBackgroundSchedulingInTestsTest。
zija.schedule.dead-letter-retry=-
zija.schedule.reporting-dead-letter-retry=-
zija.schedule.expiry-scan=-
zija.schedule.mail-digest=-
zija.schedule.file-purge=-
zija.schedule.knowledge-prepare=-
