spring:
  application:
    name: zija
  # 激活的 Profile（如 prod）；通过 ZIJA_PROFILES_ACTIVE 环境变量控制
  profiles:
    active: ${ZIJA_PROFILES_ACTIVE:}
  datasource:
    url: ${ZIJA_DB_URL:jdbc:postgresql://localhost:5432/zija}
    username: ${ZIJA_DB_USERNAME:zija}
    password: ${ZIJA_DB_PASSWORD:zija}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
  mvc:
    problemdetails:
      enabled: true
  servlet:
    encoding:
      charset: UTF-8
      # force=true 让所有响应（包括直接使用 HttpServletResponse.getWriter() 的
      # Security 异常处理器）都以 UTF-8 输出。Servlet 规范默认 ISO-8859-1，
      # 会把中文错误文案退化成 "????"。
      force: true
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mail:
    host: ${ZIJA_SMTP_HOST:}
    port: ${ZIJA_SMTP_PORT:587}
    username: ${ZIJA_SMTP_USERNAME:}
    password: ${ZIJA_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${ZIJA_SMTP_TLS:true}
  ai:
    ollama:
      base-url: ${ZIJA_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${ZIJA_AI_CHAT_MODEL:qwen2.5:7b}
      embedding:
        model: ${ZIJA_AI_EMBEDDING_MODEL:qwen3-embedding:0.6b}
    vectorstore:
      pgvector:
        schema-name: public
        table-name: ai_knowledge_chunk
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: false
        schema-validation: true

server:
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      # 显式声明信任的反向代理 IP 段，覆盖 Tomcat 默认值。
      # 包含 RFC 1918 全部私有网段，确保 Docker Compose 任意自定义子网均可正确解析客户端 IP。
      # 生产环境如有固定 Nginx/Gateway IP，可替换为更精确的表达式。
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.1[6-9]\.\d{1,3}\.\d{1,3}|172\.2[0-9]\.\d{1,3}\.\d{1,3}|172\.3[0-1]\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1
  servlet:
    session:
      timeout: 24h
      cookie:
        name: ZIJA_SESSION
        http-only: true
        same-site: lax

info:
  app:
    version: ${ZIJA_VERSION:dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
      show-details: never

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.zija.system.internal.persistence
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 10
  global-config:
    banner: false
    db-config:
      id-type: assign_uuid

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${ZIJA_SWAGGER_ENABLED:false}

zija:
  file:
    storage-path: ${ZIJA_FILE_STORAGE_PATH:/var/lib/zija/files}
    # 附件回收站保留期（天）：保留期满后由清除任务物理删除
    retention-days: ${ZIJA_FILE_RETENTION_DAYS:30}

  # 后台定时任务（时区与 cron；测试环境 cron 置 "-" 禁用）
  schedule:
    zone: ${ZIJA_SCHEDULE_ZONE:Asia/Shanghai}
    expiry-scan: ${ZIJA_SCHEDULE_EXPIRY_SCAN:0 0 3 * * *}              # 每日临期扫描
    mail-digest: ${ZIJA_SCHEDULE_MAIL_DIGEST:0 30 3 * * *}             # 每日邮件摘要
    dead-letter-retry: ${ZIJA_SCHEDULE_DEAD_LETTER_RETRY:*/30 * * * * *}   # 事件死信重投
    reporting-dead-letter-retry: ${ZIJA_SCHEDULE_REPORTING_DLQ_RETRY:*/30 * * * * *}  # 报表死信重投
    file-purge: ${ZIJA_SCHEDULE_FILE_PURGE:0 20 3 * * *}               # 附件回收站保留期清除
    knowledge-prepare: ${ZIJA_SCHEDULE_KNOWLEDGE_PREPARE:*/10 * * * * *}  # 知识来源异步准备/重试扫描

  login:
    rate-limit:
      account-threshold: ${ZIJA_RATE_LIMIT_ACCOUNT_THRESHOLD:5}
      account-window-minutes: ${ZIJA_RATE_LIMIT_ACCOUNT_WINDOW_MINUTES:5}
      ip-threshold: ${ZIJA_RATE_LIMIT_IP_THRESHOLD:50}
      ip-window-minutes: ${ZIJA_RATE_LIMIT_IP_WINDOW_MINUTES:5}
      max-entries: ${ZIJA_RATE_LIMIT_MAX_ENTRIES:1000}
