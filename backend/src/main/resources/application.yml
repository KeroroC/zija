spring:
  application:
    name: zija
  datasource:
    url: ${ZIJA_DB_URL:jdbc:postgresql://localhost:5432/zija}
    username: ${ZIJA_DB_USERNAME:zija}
    password: ${ZIJA_DB_PASSWORD:zija}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  session:
    jdbc:
      initialize-schema: never
    timeout: 24h

server:
  shutdown: graceful
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 24h
      cookie:
        name: ZIJA_SESSION
        http-only: true
        same-site: lax

info:
  app:
    version: ${ZIJA_VERSION:dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 10
  global-config:
    banner: false
    db-config:
      id-type: assign_uuid

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${ZIJA_SWAGGER_ENABLED:false}
